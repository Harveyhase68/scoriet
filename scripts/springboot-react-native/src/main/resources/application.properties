spring.application.name={:projectname:}

# --- MySQL (WampServer) ---
# createDatabaseIfNotExist=true: the schema "{:projectdatabase:}" is created automatically
# on first connection; the tables themselves are created via the setup wizard.
spring.datasource.url=jdbc:mysql://{:projectdbserver:}:{:projectdbport:}/{:projectdatabase:}?createDatabaseIfNotExist=true&characterEncoding=utf8&serverTimezone=UTC
spring.datasource.username={:projectdbusername:}
spring.datasource.password={:projectdbpassword:}

# --- JPA ---
# Tables are managed by the setup wizard (db/schema.sql), never by Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Explicit dialect so the application can start even when MySQL is down
# (the setup page then shows the connection error instead of a crash).
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JWT (stateless Bearer-token auth for the React Native app) ---
# The secret must be >= 32 bytes for HMAC-SHA256. Change it for any real deployment.
app.jwt.secret=change-me-scoriet-template-react-native-dev-secret-0123456789
# Token lifetime in milliseconds (default 24h).
app.jwt.expiration-ms=86400000
