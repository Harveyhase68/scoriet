name: {:snakecase(projectname):}
description: "{:projectname:} — generated by Scoriet (Window Designer navigation skeleton)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Generates real business logic from SML code-behind (Window Designer
# events/procedures/globals/structs/constants) via lib/generator/sml_to_dart.js
# - see lib/core/sml_runtime/ and this template's own README.md.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  desktop_multi_window: ^0.3.0
  window_manager: ^0.5.2
  # SML runtime library dependencies (see lib/core/sml_runtime/) - only
  # pulled in because the corresponding lib_<namespace>.dart file needs a
  # real implementation, never speculatively.
  http: ^1.6.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  sqlite3: ^3.5.2
  # Real network connection for `db.*`/`sql.*` against the Scoriet project's
  # OWN configured database (see sml_db_config.dart/lib_db.dart) - pure
  # Dart (no FFI/native binaries needed, unlike sqlite3 above), so it works
  # the same way on every Flutter desktop target this template ships for.
  mysql1: ^0.20.0
  crypto: ^3.0.7
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
