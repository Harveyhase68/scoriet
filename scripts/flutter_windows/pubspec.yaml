name: {:snakecase(projectname):}
description: "{:projectname:} — generated by Scoriet (Window Designer navigation skeleton)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Rudimentary on purpose: this template only calls up the windows designed
# in Scoriet's Window Designer (a menu + one screen per window) so they can
# be browsed and tapped through. No state management, no database access,
# no business logic - those are a later generation step once each window's
# generated screen has real code behind its controls.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  desktop_multi_window: ^0.3.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
