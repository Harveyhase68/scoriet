name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Setup Environment
        run: |
          # Ensure SQLite configuration for testing
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env || echo "DB_CONNECTION=sqlite" >> .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=:memory:/' .env || echo "DB_DATABASE=:memory:" >> .env
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=array/' .env || echo "SESSION_DRIVER=array" >> .env
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=array/' .env || echo "CACHE_STORE=array" >> .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env || echo "QUEUE_CONNECTION=sync" >> .env
          # Remove any MySQL configuration that might interfere
          sed -i '/^DB_HOST=/d' .env || true
          sed -i '/^DB_PORT=/d' .env || true
          sed -i '/^DB_USERNAME=/d' .env || true
          sed -i '/^DB_PASSWORD=/d' .env || true
          # Ensure proper line endings and remove any invalid characters
          dos2unix .env || true

      - name: Validate Environment File
        run: |
          echo "Validating .env file..."
          cat .env | head -20
          echo "Checking for problematic characters..."
          grep -n "DB_CONNECTION" .env || echo "No DB_CONNECTION found"  

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Generate Passport Keys
        run: php artisan passport:keys

      - name: Run Database Migrations
        run: php artisan migrate:fresh --force 2>/dev/null || echo "Migrations skipped (using simplified tests)"
        continue-on-error: true

      - name: Tests
        run: ./vendor/bin/pest
